  /account:
    delete:
      operationId: deleteMyAccount
      summary: Permanently delete the authenticated user's account and personal data
      responses:
        "202":
          description: App data is removed; authentication and uploaded-media cleanup are processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionResult"
        "403":
          description: The account is already deleted or unavailable
        "500":
          description: The deletion request could not be started

components:
  schemas:
    LumiMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 1600
    LumiConversationInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 800
        history:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/LumiMessage"
        locale:
          type: string
          maxLength: 32
        game:
          type: string
          maxLength: 100
    LumiRecommendation:
      type: object
      required: [type, title, reason]
      properties:
        type:
          type: string
          enum: [music, guides, friends, campfire, outfit, manga, journal, session, chat]
        title:
          type: string
          maxLength: 80
        reason:
          type: string
          maxLength: 240
        query:
          type: string
          maxLength: 80
        draft:
          type: string
          maxLength: 1000
        duration:
          type: integer
          enum: [5, 15, 30]
    LumiConversationResult:
      type: object
      required: [reply, recommendations, fallback]
      properties:
        reply:
          type: string
          maxLength: 1600
        recommendations:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/LumiRecommendation"
        fallback:
          type: boolean
        mood:
          type: string
          description: Temporary user-stated mood for this conversation, never a diagnosis or permanent profile.
          enum: [unknown, neutral, sad, lonely, stressed, tired, happy, calm, excited]
        phase:
          type: string
