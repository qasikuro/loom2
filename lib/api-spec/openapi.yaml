openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Sky Journal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: config
    description: Public application settings
  - name: character
    description: Character profile
  - name: journal
    description: Journal entries
  - name: stories
    description: Manga-style stories
  - name: outfits
    description: Outfit logs
  - name: gallery
    description: Photo gallery
  - name: social
    description: Follows, friends, and discover feed
  - name: notifications
    description: Activity notifications
  - name: rewards
    description: Rewards, shop, and constellation
  - name: manga
    description: AI manga generation

paths:
  /drift/companion:
    post:
      operationId: converseWithLumi
      tags: [lumi]
      summary: Chat with Lumi and receive optional supported action suggestions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LumiConversationInput"
      responses:
        "200":
          description: Validated response, or an explicitly marked local fallback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LumiConversationResult"
        "429":
          description: Configured usage limit reached
  /drift/companion-state:
    get:
      operationId: getLumiState
      tags: [lumi]
      responses:
        "200":
          description: Only the authenticated player's opted-in history and preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LumiState"
    put:
      operationId: updateLumiState
      tags: [lumi]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LumiPreferencesInput"
      responses:
        "200":
          description: Updated preferences; opting out deletes saved history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LumiState"
    delete:
      operationId: clearLumiState
      tags: [lumi]
      responses:
        "200":
          description: Conversation and preferences deleted; remembering disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LumiClearResult"
  /manga/generate:
    post:
      operationId: generateMangaPage
      tags: [manga]
      summary: Generate one AI manga page from uploaded reference images
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MangaGenerationInput"
      responses:
        "200":
          description: Generated manga page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MangaGenerationResult"
        "429":
          description: Daily generation limit reached

  /media/read-urls:
    post:
      operationId: resolveMediaReadUrls
      tags: [stories]
      summary: Resolve managed media paths into owner-authorized read URLs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaReadUrlsInput"
      responses:
        "200":
          description: Canonical media paths mapped to raw public paths or short-lived owner URLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaReadUrlsResponse"
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "404":
          description: Media unavailable

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /config:
    get:
      operationId: getAppConfig
      tags: [config]
      summary: Get public app settings and feature flags
      responses:
        "200":
          description: Public app configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfig"

  /character:
    get:
      operationId: getCharacter
      tags: [character]
      summary: Get the user character profile
      responses:
        "200":
          description: Character profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
    put:
      operationId: updateCharacter
      tags: [character]
      summary: Update the user character profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterInput"
      responses:
        "200":
          description: Updated character profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"

  /journal-entries:
    get:
      operationId: listJournalEntries
      tags: [journal]
      summary: List all journal entries newest first
      responses:
        "200":
          description: List of journal entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
    post:
      operationId: createJournalEntry
      tags: [journal]
      summary: Create a new journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryInput"
      responses:
        "201":
          description: Created journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /journal-entries/{id}:
    delete:
      operationId: deleteJournalEntry
      tags: [journal]
      summary: Delete a journal entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /stories:
    get:
      operationId: listStories
      tags: [stories]
      summary: List all stories newest first
      responses:
        "200":
          description: List of stories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Story"
    post:
      operationId: createStory
      tags: [stories]
      summary: Create a new story
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryInput"
      responses:
        "201":
          description: Created story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"

  /media/compose-video:
    post:
      operationId: composeVideo
      tags: [stories]
      summary: Compose a trimmed video and optional Audius music track
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ComposeVideoRequest"
      responses:
        "201":
          description: Composed video awaiting story claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposeVideoResponse"

  /stories/{id}:
    get:
      operationId: getStory
      tags: [stories]
      summary: Get a story by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "404":
          description: Not found
    delete:
      operationId: deleteStory
      tags: [stories]
      summary: Delete a story
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /stories/{id}/witness:
    post:
      operationId: witnessStory
      tags: [stories]
      summary: Increment the witnessed count of a story
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"

  /outfits:
    get:
      operationId: listOutfits
      tags: [outfits]
      summary: List all outfit logs newest first
      responses:
        "200":
          description: List of outfits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Outfit"
    post:
      operationId: createOutfit
      tags: [outfits]
      summary: Create an outfit log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutfitInput"
      responses:
        "201":
          description: Created outfit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Outfit"

  /outfits/{id}:
    delete:
      operationId: deleteOutfit
      tags: [outfits]
      summary: Delete an outfit log
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /gallery:
    get:
      operationId: listGallery
      tags: [gallery]
      summary: List all gallery photos newest first
      responses:
        "200":
          description: List of gallery photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GalleryPhoto"

  /gallery/usage:
    get:
      operationId: getGalleryUsage
      tags: [gallery]
      summary: Get gallery storage usage
      responses:
        "200":
          description: Gallery usage stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryUsage"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List activity notifications newest first
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /discover:
    get:
      operationId: listDiscoverFeed
      tags: [social]
      summary: Ranked discovery feed of public stories
      responses:
        "200":
          description: List of discover posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiscoverPost"

  /guide-sessions:
    get:
      operationId: listGuideSessions
      tags: [social]
      summary: List upcoming or active guide sessions
      parameters:
        - in: query
          name: guideId
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Sessions visible to the authenticated viewer
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GuideSession" }
    post:
      operationId: createGuideSession
      tags: [social]
      summary: Schedule a public guide session with an optional cover image
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGuideSessionInput" }
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuideSession" }
        "400":
          description: Invalid session details or cover image
        "403":
          description: Guide access required or cover image not owned by the guide

  /guide-sessions/{sessionId}:
    get:
      operationId: getGuideSession
      tags: [social]
      summary: Get a guide session and its attached tutorial
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Session detail for a visible guide
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuideSession" }
        "404": { description: Session not found or unavailable }
    patch:
      operationId: rescheduleGuideSession
      tags: [social]
      summary: Reschedule a guide's upcoming session and notify joined participants
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RescheduleGuideSessionInput" }
      responses:
        "200":
          description: Rescheduled session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuideSession" }
        "400": { description: Invalid new start time }
        "404": { description: Session not found or no longer upcoming }
        "409": { description: Session changed concurrently; refresh and try again }
    delete:
      operationId: cancelGuideSession
      tags: [social]
      summary: Cancel a guide's upcoming session and notify joined participants
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Session cancelled }
        "404": { description: Session not found or no longer upcoming }

  /guide-sessions/{sessionId}/join:
    post:
      operationId: joinGuideSession
      tags: [social]
      summary: Join a scheduled guide session and its shared chat
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Joined session, including its tutorial and chat room
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuideSession" }
        "403": { description: Session is full or unavailable }

  /guide-sessions/{sessionId}/progress:
    patch:
      operationId: saveGuideTutorialProgress
      tags: [social]
      summary: Save the authenticated attendee's completed tutorial steps
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuideTutorialProgressInput" }
      responses:
        "200":
          description: Updated session and attendee progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuideSession" }
        "403": { description: Join the session before saving progress }

  /guide-sessions/{sessionId}/participants:
    get:
      operationId: listGuideSessionParticipants
      tags: [social]
      summary: List visible attendees for the guide who owns the session
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Attendees and their tutorial progress
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GuideSessionParticipant" }
        "404": { description: Session not found or caller is not its guide }

  /guide-sessions/{sessionId}/engagement:
    get:
      operationId: getGuideSessionEngagement
      tags: [social]
      summary: Get polls, participant questions, and the recap for a joined session
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Session engagement visible to the guide and attendees
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuideSessionEngagement" }
        "404": { description: Caller has not joined the session }
        "503": { description: Engagement schema is not available yet }

  /guide-sessions/{sessionId}/polls:
    post:
      operationId: createGuideSessionPoll
      tags: [social]
      summary: Create a live poll as the session guide
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuideSessionPollInput" }
      responses:
        "201":
          description: Poll created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuideSessionPoll" }
        "409": { description: Session is not live }

  /guide-sessions/{sessionId}/polls/{pollId}/vote:
    patch:
      operationId: voteGuideSessionPoll
      tags: [social]
      summary: Vote or change a vote in a live session poll
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: pollId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuideSessionPollVoteInput" }
      responses:
        "200": { description: Vote saved }
        "400": { description: Invalid option }
        "403": { description: Join the session to vote }
        "409": { description: Poll is closed or session is not live }

  /guide-sessions/{sessionId}/polls/{pollId}/close:
    patch:
      operationId: closeGuideSessionPoll
      tags: [social]
      summary: Close a session poll as its guide
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: pollId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Poll closed }
        "404": { description: Poll not found or caller is not the guide }

  /guide-sessions/{sessionId}/questions:
    post:
      operationId: askGuideSessionQuestion
      tags: [social]
      summary: Ask the guide a question during a live session
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuideSessionQuestionInput" }
      responses:
        "201":
          description: Question submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuideSessionQuestion" }
        "403": { description: Join as a participant to ask a question }
        "409": { description: Session is not live }

  /guide-sessions/{sessionId}/questions/{questionId}:
    patch:
      operationId: answerGuideSessionQuestion
      tags: [social]
      summary: Answer a participant question as the session guide
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: questionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuideSessionAnswerInput" }
      responses:
        "200":
          description: Answer saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuideSessionQuestion" }
        "404": { description: Question not found or caller is not the guide }

  /guide-sessions/{sessionId}/questions/{questionId}/vote:
    put:
      operationId: voteGuideSessionQuestion
      tags: [social]
      summary: Upvote or remove an upvote from a live session question
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: questionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuideSessionQuestionVoteInput" }
      responses:
        "200": { description: Question vote saved }
        "403": { description: Join the session to vote and do not vote on your own question }
        "409": { description: Session is not live }

  /guide-sessions/{sessionId}/activities:
    post:
      operationId: createGuideSessionActivity
      tags: [social]
      summary: Launch a live exercise, reflection, or resource as the session guide
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuideSessionActivityInput" }
      responses:
        "201":
          description: Activity launched; any previous activity is completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuideSessionActivity" }
        "403": { description: Caller is not the guide }
        "409": { description: Session is not live }
        "503": { description: Activity storage is not available yet }

  /guide-sessions/{sessionId}/activities/{activityId}/responses:
    post:
      operationId: respondToGuideSessionActivity
      tags: [social]
      summary: Submit or update a response to the active session activity
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: activityId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuideSessionActivityResponseInput" }
      responses:
        "200": { description: Activity response saved }
        "403": { description: Join the session as a participant to respond }
        "409": { description: Activity is closed or the session is not live }
        "503": { description: Activity storage is not available yet }

  /guide-sessions/{sessionId}/activities/{activityId}/close:
    patch:
      operationId: closeGuideSessionActivity
      tags: [social]
      summary: Complete the active activity as the session guide
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: activityId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Activity completed }
        "404": { description: Activity not found or caller is not the guide }
        "503": { description: Activity storage is not available yet }

  /guide-sessions/{sessionId}/recap:
    put:
      operationId: saveGuideSessionRecap
      tags: [social]
      summary: Publish or update the post-session recap as its guide
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuideSessionRecapInput" }
      responses:
        "200":
          description: Recap published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuideSessionRecap" }
        "409": { description: Session has not ended yet }

  /guide-sessions/{sessionId}/end:
    post:
      operationId: endGuideSession
      tags: [social]
      summary: End a scheduled guide session as its owner
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Session ended }
        "404": { description: Session not found or already ended }

  /guide-tutorials:
    get:
      operationId: listGuideTutorials
      tags: [social]
      summary: List discoverable tutorials or the authenticated guide's own tutorials
      parameters:
        - in: query
          name: mine
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: Visible tutorials
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GuideTutorial" }
    post:
      operationId: createGuideTutorial
      tags: [social]
      summary: Save a tutorial draft or publish it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuideTutorialInput" }
      responses:
        "201":
          description: Saved tutorial
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuideTutorial" }
        "403": { description: Guide access required }

  /guide-tutorials/{tutorialId}:
    get:
      operationId: getGuideTutorial
      tags: [social]
      summary: Get a published or owned guide tutorial
      parameters:
        - in: path
          name: tutorialId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Tutorial details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuideTutorial" }
        "404": { description: Tutorial not found or unavailable }
    patch:
      operationId: updateGuideTutorial
      tags: [social]
      summary: Update a guide's own tutorial
      parameters:
        - in: path
          name: tutorialId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuideTutorialInput" }
      responses:
        "200":
          description: Updated tutorial
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuideTutorial" }
        "404": { description: Tutorial not found }

  /users/{userId}:
    get:
      operationId: getPublicUserProfile
      tags: [social]
      summary: Get a public user profile and viewer profile-like state
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUserProfile"
        "403":
          description: Profile unavailable due to a block
        "404":
          description: Profile not found or private

  /users/{userId}/like:
    post:
      operationId: likeUserProfile
      tags: [social]
      summary: Like another user's public profile
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current profile like state and count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileLikeState"
        "400":
          description: Cannot like your own profile
        "403":
          description: Profile unavailable due to a block
        "404":
          description: Profile not found or private
    delete:
      operationId: unlikeUserProfile
