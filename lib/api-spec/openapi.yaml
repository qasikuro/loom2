openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Sky Journal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: config
    description: Public application settings
  - name: character
    description: Character profile
  - name: journal
    description: Journal entries
  - name: stories
    description: Manga-style stories
  - name: outfits
    description: Outfit logs
  - name: gallery
    description: Photo gallery
  - name: social
    description: Follows, friends, and discover feed
  - name: notifications
    description: Activity notifications
  - name: rewards
    description: Rewards, shop, and constellation
  - name: manga
    description: AI manga generation

paths:
  /manga/generate:
    post:
      operationId: generateMangaPage
      tags: [manga]
      summary: Generate one AI manga page from uploaded reference images
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MangaGenerationInput"
      responses:
        "200":
          description: Generated manga page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MangaGenerationResult"
        "429":
          description: Daily generation limit reached

  /media/read-urls:
    post:
      operationId: resolveMediaReadUrls
      tags: [stories]
      summary: Resolve managed media paths into owner-authorized read URLs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaReadUrlsInput"
      responses:
        "200":
          description: Canonical media paths mapped to raw public paths or short-lived owner URLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaReadUrlsResponse"
        "400":
          description: Invalid request
        "401":
          description: Authentication required
        "404":
          description: Media unavailable

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /config:
    get:
      operationId: getAppConfig
      tags: [config]
      summary: Get public app settings and feature flags
      responses:
        "200":
          description: Public app configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfig"

  /character:
    get:
      operationId: getCharacter
      tags: [character]
      summary: Get the user character profile
      responses:
        "200":
          description: Character profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
    put:
      operationId: updateCharacter
      tags: [character]
      summary: Update the user character profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterInput"
      responses:
        "200":
          description: Updated character profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"

  /journal-entries:
    get:
      operationId: listJournalEntries
      tags: [journal]
      summary: List all journal entries newest first
      responses:
        "200":
          description: List of journal entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
    post:
      operationId: createJournalEntry
      tags: [journal]
      summary: Create a new journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryInput"
      responses:
        "201":
          description: Created journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /journal-entries/{id}:
    delete:
      operationId: deleteJournalEntry
      tags: [journal]
      summary: Delete a journal entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /stories:
    get:
      operationId: listStories
      tags: [stories]
      summary: List all stories newest first
      responses:
        "200":
          description: List of stories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Story"
    post:
      operationId: createStory
      tags: [stories]
      summary: Create a new story
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryInput"
      responses:
        "201":
          description: Created story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"

  /media/compose-video:
    post:
      operationId: composeVideo
      tags: [stories]
      summary: Compose a trimmed video and optional Audius music track
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ComposeVideoRequest"
      responses:
        "201":
          description: Composed video awaiting story claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposeVideoResponse"

  /stories/{id}:
    get:
      operationId: getStory
      tags: [stories]
      summary: Get a story by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "404":
          description: Not found
    delete:
      operationId: deleteStory
      tags: [stories]
      summary: Delete a story
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /stories/{id}/witness:
    post:
      operationId: witnessStory
      tags: [stories]
      summary: Increment the witnessed count of a story
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"

  /outfits:
    get:
      operationId: listOutfits
      tags: [outfits]
      summary: List all outfit logs newest first
      responses:
        "200":
          description: List of outfits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Outfit"
    post:
      operationId: createOutfit
      tags: [outfits]
      summary: Create an outfit log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutfitInput"
      responses:
        "201":
          description: Created outfit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Outfit"

  /outfits/{id}:
    delete:
      operationId: deleteOutfit
      tags: [outfits]
      summary: Delete an outfit log
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /gallery:
    get:
      operationId: listGallery
      tags: [gallery]
      summary: List all gallery photos newest first
      responses:
        "200":
          description: List of gallery photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GalleryPhoto"

  /gallery/usage:
    get:
      operationId: getGalleryUsage
      tags: [gallery]
      summary: Get gallery storage usage
      responses:
        "200":
          description: Gallery usage stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryUsage"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List activity notifications newest first
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /discover:
    get:
      operationId: listDiscoverFeed
      tags: [social]
      summary: Ranked discovery feed of public stories
      responses:
        "200":
          description: List of discover posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiscoverPost"

  /users/{userId}:
    get:
      operationId: getPublicUserProfile
      tags: [social]
      summary: Get a public user profile and viewer profile-like state
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUserProfile"
        "403":
          description: Profile unavailable due to a block
        "404":
          description: Profile not found or private

  /users/{userId}/like:
    post:
      operationId: likeUserProfile
      tags: [social]
      summary: Like another user's public profile
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current profile like state and count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileLikeState"
        "400":
          description: Cannot like your own profile
        "403":
          description: Profile unavailable due to a block
        "404":
          description: Profile not found or private
    delete:
      operationId: unlikeUserProfile
      tags: [social]
      summary: Remove a profile like
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current profile like state and count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileLikeState"
        "403":
          description: Profile unavailable due to a block
        "404":
          description: Profile not found or private

  /stories/{id}/like:
    post:
      operationId: likeStory
      tags: [stories]
      summary: Like a visible public story or video post
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Current like state and count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryLikeState"
        "403":
          description: Story unavailable due to a block
        "404":
          description: Story not found or not visible
    delete:
      operationId: unlikeStory
      tags: [stories]
      summary: Remove a story or video post like
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Current like state and count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryLikeState"
        "403":
          description: Story unavailable due to a block
        "404":
          description: Story not found or not visible

  /chapters/{id}/like:
    post:
      operationId: likeBookChapter
      tags: [stories]
      summary: Like a published chapter in a public book
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Current like state and count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryLikeState"
        "403":
          description: Chapter unavailable due to a block
        "404":
          description: Chapter not found or not visible
    delete:
      operationId: unlikeBookChapter
      tags: [stories]
      summary: Remove a chapter like
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Current like state and count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryLikeState"
        "403":
          description: Chapter unavailable due to a block
        "404":
          description: Chapter not found or not visible

  /rewards:
    get:
      operationId: getRewardBalance
      tags: [rewards]
      summary: Get current reward currency balances
      responses:
        "200":
          description: Reward balances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardBalance"

  /rewards/shop:
    get:
      operationId: getRewardsShop
      tags: [rewards]
      summary: Get shop catalog, purchased IDs and active cosmetics
      responses:
        "200":
          description: Shop data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopResponse"

  /constellation:
    get:
      operationId: getConstellation
      tags: [rewards]
      summary: Get constellation progress
      responses:
        "200":
          description: Constellation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConstellationState"

  /friends:
    get:
      operationId: listFriends
      tags: [social]
      summary: List profiles of users I follow
      responses:
        "200":
          description: List of friend profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FriendSummary"

  /follows/following:
    get:
      operationId: listFollowing
      tags: [social]
      summary: Get IDs of users I follow
      responses:
        "200":
          description: List of user IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /friends/requests:
    get:
      operationId: listFriendRequests
      tags: [social]
      summary: List pending friend invitations
      responses:
        "200":
          description: Pending invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FriendRequest"

  /friends/requests/{targetUserId}:
    post:
      operationId: sendFriendRequest
      tags: [social]
      summary: Send a friend invitation
      parameters:
        - in: path
          name: targetUserId
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Invitation sent
        "409":
          description: Already friends or pending

  /friends/requests/{id}:
    delete:
      operationId: removeFriendRequest
      tags: [social]
      summary: Decline or cancel an invitation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Invitation removed

  /friends/requests/{id}/accept:
    post:
      operationId: acceptFriendRequest
      tags: [social]
      summary: Accept an incoming invitation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Friend added

  /storigam-interest:
    post:
      operationId: submitStorigamInterest
      tags: [config]
      summary: Register interest in the Storigam beta or creator program
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorigamInterestInput"
      responses:
        "200":
          description: Interest recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorigamInterestResponse"
        "400":
          description: Invalid input or required consent is missing
        "429":
          description: Too many submissions

  /storigam-interest/unsubscribe:
    get:
      operationId: viewStorigamUnsubscribe
      tags: [config]
      summary: Show unsubscribe confirmation
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Confirmation page
          content:
            text/html:
              schema: { type: string }
    post:
      operationId: confirmStorigamUnsubscribe
      tags: [config]
      summary: Stop future Storigam interest emails
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Unsubscribed
          content:
            text/html:
              schema: { type: string }

  /admin/emails:
    post:
      operationId: sendAdminEmail
      tags: [admin]
      summary: Send one plain-text email from the admin console
      description: Requires an authenticated administrator. The sender and provider credentials are kept on the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminEmailInput"
      responses:
        "200":
          description: Email accepted by Resend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEmailResponse"
        "400":
          description: Invalid recipient, subject, or message
        "403":
          description: Administrator access required
        "429":
          description: Too many emails sent
        "502":
          description: Email provider rejected the request

  /admin/interest/subscribers:
    get:
      operationId: listInterestSubscribers
      tags: [admin]
      summary: List landing page signups and consent status
      responses:
        "200":
          description: Subscribers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestSubscribersResponse"

  /admin/interest/campaigns:
    get:
      operationId: listInterestCampaigns
      tags: [admin]
      summary: List landing page email campaigns
      responses:
        "200":
          description: Campaigns with send progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestCampaignsResponse"
    post:
      operationId: createInterestCampaign
      tags: [admin]
      summary: Prepare a campaign for consented landing page subscribers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterestCampaignInput"
      responses:
        "200":
          description: Campaign prepared; no emails sent yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestCampaign"
        "400":
          description: Invalid message or no eligible subscribers

  /admin/interest/campaigns/{id}/dispatch:
    post:
      operationId: dispatchInterestCampaign
      tags: [admin]
      summary: Send the next batch of a prepared campaign
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Updated campaign progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestCampaign"

components:
  schemas:
    MediaReadUrlsInput:
      type: object
      additionalProperties: false
      properties:
        paths:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 2048
      required: [paths]

    MediaReadUrlsResponse:
      type: object
      properties:
        urls:
          type: object
          additionalProperties:
            type: string
      required: [urls]

    MangaGenerationInput:
      type: object
      properties:
        requestId:
          type: string
        imageUris:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
        prompt:
          type: string
          maxLength: 500
        style:
          type: string
          enum: [manga, color, chibi, cinematic, webtoon]
      required: [requestId, imageUris, prompt, style]

    MangaGenerationResult:
      type: object
      properties:
        imageUri:
          type: string
        remainingToday:
          type: integer
      required: [imageUri, remainingToday]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    StorigamInterestInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        interests:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: string
            enum: [beta_tester, content_creator]
        consent:
          type: boolean
        website:
          type: string
          maxLength: 100
          description: Hidden anti-spam field; must be left empty.
      required: [email, interests, consent]

    StorigamInterestResponse:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]

    InterestSubscriber:
      type: object
      properties:
        email: { type: string, format: email }
        interests:
          type: array
          items: { type: string }
        consentedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        unsubscribedAt: { type: ["string", "null"], format: date-time }
      required: [email, interests, consentedAt, createdAt, unsubscribedAt]

    InterestSubscribersResponse:
      type: object
      properties:
        subscribers:
          type: array
          items: { $ref: "#/components/schemas/InterestSubscriber" }
        total: { type: integer }
        activeTotal: { type: integer }
        audienceCounts:
          type: object
          properties:
            all: { type: integer }
            beta_tester: { type: integer }
            content_creator: { type: integer }
          required: [all, beta_tester, content_creator]
      required: [subscribers, total, activeTotal, audienceCounts]

    InterestCampaignInput:
      type: object
      additionalProperties: false
      properties:
        audience:
          type: string
          enum: [all, beta_tester, content_creator]
        subject: { type: string, minLength: 1, maxLength: 200 }
        message: { type: string, minLength: 1, maxLength: 10000 }
      required: [audience, subject, message]

    InterestCampaign:
      type: object
      properties:
        id: { type: string, format: uuid }
        audience:
          type: string
          enum: [all, beta_tester, content_creator]
        subject: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }
        total: { type: integer }
        accepted: { type: integer }
        failed: { type: integer }
        pending: { type: integer }
        uncertain: { type: integer }
        skipped: { type: integer }
      required: [id, audience, subject, message, createdAt, total, accepted, failed, pending, uncertain, skipped]

    InterestCampaignsResponse:
      type: object
      properties:
        campaigns:
          type: array
          items: { $ref: "#/components/schemas/InterestCampaign" }
      required: [campaigns]

    AdminEmailInput:
      type: object
      additionalProperties: false
      properties:
        to:
          type: string
          format: email
          maxLength: 254
        subject:
          type: string
          minLength: 1
          maxLength: 200
        message:
          type: string
          minLength: 1
          maxLength: 10000
      required: [to, subject, message]

    AdminEmailResponse:
      type: object
      properties:
        ok:
          type: boolean
        id:
          type: string
      required: [ok, id]

    Character:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        bio:
          type: string
        mood:
          type: string
        traits:
          type: array
          items:
            type: string
        isPublic:
          type: boolean
        updatedAt:
          type: string
          format: date-time
      required: [id, name, bio, mood, traits, isPublic, updatedAt]

    CharacterInput:
      type: object
      properties:
        name:
          type: string
        bio:
          type: string
        mood:
          type: string
        traits:
          type: array
          items:
            type: string
        isPublic:
          type: boolean
      required: [name, bio, mood, traits, isPublic]

    StoryPanel:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        imageUri:
          type: string
          nullable: true
      required: [id, text]

    StoryMusic:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        artist:
          type: string
        artworkUrl:
          type: string
          nullable: true
        duration:
          type: integer
          minimum: 1
          maximum: 3600
        genre:
          type: string
          nullable: true
        mood:
          type: string
          nullable: true
        streamUrl:
          type: string
          format: uri
        embedded:
          type: boolean
        baked:
          type: boolean
        segmentStartSeconds:
          type: number
          minimum: 0
        segmentDurationSeconds:
          type: number
          exclusiveMinimum: 0
          maximum: 60
        originalVolume:
          type: number
          minimum: 0
          maximum: 1
        musicVolume:
          type: number
          minimum: 0
          maximum: 1
      required: [id, title, artist, artworkUrl, duration, genre, mood, streamUrl]

    Story:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
          format: date-time
        chapterTitle:
          type: string
        panels:
          type: array
          items:
            $ref: "#/components/schemas/StoryPanel"
        mood:
          type: string
        location:
          type: string
        isPublic:
          type: boolean
        music:
