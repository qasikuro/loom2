      summary: Send a photo without silently dropping it on older servers
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatPhotoInput" }
      responses:
        "201":
          description: Sent photo message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
        "400":
          description: A valid photo is required
        "403":
          description: Blocked conversation or photo not owned by sender
  /messages/{userId}:
    get:
      operationId: getChatConversation
      summary: Read a private direct-message conversation
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
        - in: query
          name: limit
          description: Number of most recent messages to return (default 50, maximum 100).
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: before
          description: ISO timestamp of the oldest message already loaded; use with beforeId for keyset pagination.
          schema: { type: string, format: date-time }
        - in: query
          name: beforeId
          description: UUID of the oldest message already loaded.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Messages visible to the authenticated participant
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChatMessage" }
    post:
      operationId: sendChatMessage
      summary: Send text, an expression, or an owned uploaded photo
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatMessageInput" }
      responses:
        "201":
          description: Sent message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
        "200":
          description: The same client message was already accepted; returns its original row
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessage" }
        "400":
          description: Invalid message or photo reference
        "403":
          description: Blocked conversation or photo not owned by sender
        "409":
          description: Client message ID was reused for a different message
        "410":
          description: The original message was deleted or hidden for this sender and cannot be replayed

